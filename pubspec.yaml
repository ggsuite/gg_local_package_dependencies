name: gg_local_package_dependencies
description: gg_local_package_dependencies reads packages located in a local folder and creates a dependency graph.
version: 3.0.0
repository: https://github.com/inlavigo/gg_local_package_dependencies.git

environment:
  sdk: ">=3.8.1<4.0.0"

dependencies:
  args: ^2.7.0
  gg_args: ^3.0.0
  gg_console_colors: ^2.3.0
  gg_log: ^1.0.6
  gg_process: ^1.1.6
  mocktail: ^1.0.5
  path: ^1.9.1
  pub_semver: ^2.2.0
  pubspec_parse: ^1.5.0

dev_dependencies:
  gg_capture_print: ^1.0.9
  lints: ^6.1.0
  test: ^1.31.2

executables:
  gg_local_package_dependencies: